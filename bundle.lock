# gimp-retouch-plugins bundle lock. Fields are separated by |  (lines starting with # are comments)
# Columns 1-7 keep their original order (install.ps1 reads them by index):
#  1 build | 2 gimp | 3 version | 4 kind | 5 source | 6 pin (sha256 or commit; '-' = this repo) | 7 license |
#  8 component | 9 dest | 10 verify | 11 params | 12 notes
# gimp: 3.0 / 3.2 / 3.0,3.2 / host (installed once per machine, independent of GIMP)
# dest/params templates: {plugdir}=~/.config/GIMP/<gimp>/plug-ins  {profile}=~/.config/GIMP/<gimp>  {home}  {gimp}
# verify tokens (space-separated): proc:<PDB name>  def:<plug-in-def path fragment in pluginrc>  cmdver:<command>=<version>  cmd:<command on PATH>  '-' = nothing to verify
# params: ';'-separated key=value
# kind:
#   ours        copy files from this repo (source = space-separated repo paths) into dest (dir ending in / or a file path); params exec=<file to chmod 755>
#   deb         download a .deb (sha256-pinned) and `sudo apt-get install` it; params pkg=<dpkg name>;check=<file that must exist>
#   apt         `sudo apt-get install` pinned package versions from the Debian archive; params pkgs=<pkg=ver ...>; pin = sha256 of the main .deb
#   git-meson   git clone + checkout pinned commit + meson build + `sudo meson install`; params check/reject/exe/meson/builddeps
#   zip         release zip (sha256-pinned) unpacked into dest; params subdir/exec/noexec/vercheck=<file>::<text>
#   rawfile     single file at a commit (sha256-pinned) copied to dest
#   flatpak     Flathub ref (--user) pinned to an OSTree commit; params shared=1 = shared runtime, only removed by --uninstall --purge
#   icu-wrapper generated wrapper plug-in + ICU libs copied from a pinned flatpak runtime; params runtime/libs/target
#   config      profile overlay from a tarball (opt-in, overwrites settings); params srcdir=<candidates, first existing wins>;preserve=<gimprc keys kept from the user's gimprc, comma-separated; default in installer>
